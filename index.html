<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUKESA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'mukesa-blue': '#0033A0',
            'mukesa-red': '#DA291C',
            'mukesa-bg': { 
              DEFAULT: '#FFFFFF', // Main background
              alt: '#F3F4F6',    // Alternative/card background
            },
            'mukesa-text': {
              DEFAULT: '#1F2937', // Primary text
              muted: '#4B5563',   // Muted text
            },
            'mukesa-border': '#D1D5DB', // Border color
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          keyframes: {
            'modal-pop-in': {
              'to': { opacity: '1', transform: 'scale(1)' },
            }
          },
          animation: {
            'modal-pop-in': 'modal-pop-in 0.3s forwards',
          },
        },
      },
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.1.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.6.0",
    "react/": "https://esm.sh/react@^19.1.0/",
    "@heroicons/react/": "https://esm.sh/@heroicons/react@^2.2.0/",
    "react-dom/": "https://esm.sh/react-dom@^19.1.0/"
  }
}
</script>
</head>
<body class="bg-mukesa-bg text-mukesa-text">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
